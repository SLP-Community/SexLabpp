<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: transparent;
    color: #ddd8d0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }

  #menu {
    background: #1c1c1e;
    border: 1px solid #3a3a3a;
    border-radius: 4px;
    width: 420px;
    max-height: 75vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.9);
  }

  #title {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    color: #c8c0b0;
    background: #252527;
    border-bottom: 1px solid #3a3a3a;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .category {
    padding: 9px 16px;
    cursor: pointer;
    font-size: 12px;
    color: #b0a898;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #2a2a2a;
    user-select: none;
  }
  .category:hover { background: #2a2a2e; color: #ddd8d0; }
  .category .arrow { font-size: 9px; opacity: 0.5; }

  .submenu {
    display: none;
    max-height: 200px;
    overflow-y: auto;
  }
  .submenu.open { display: block; }

  .submenu-item {
    padding: 7px 16px 7px 28px;
    cursor: pointer;
    font-size: 12px;
    color: #888078;
    border-bottom: 1px solid #222;
    background: #161618;
  }
  .submenu-item:hover { background: #222226; color: #ddd8d0; }
  .submenu-item.active-scene { color: #70b870; }

  /* Text entry overlay — only covers #menu, not whole screen */
  #text-entry {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    align-items: center;
    justify-content: center;
    border-radius: 4px;
  }
  #text-entry.open { display: flex; }

  #text-entry-box {
    background: #1c1c1e;
    border: 1px solid #3a3a3a;
    border-radius: 4px;
    padding: 20px;
    width: 320px;
  }
  #text-entry-box label {
    display: block;
    margin-bottom: 8px;
    color: #b0a898;
    font-size: 12px;
    letter-spacing: 0.3px;
  }
  #text-entry-box input {
    width: 100%;
    background: #111113;
    border: 1px solid #3a3a3a;
    color: #ddd8d0;
    padding: 7px 10px;
    font-size: 12px;
    border-radius: 3px;
    outline: none;
    margin-bottom: 12px;
    font-family: 'Segoe UI', sans-serif;
  }
  #text-entry-box input:focus { border-color: #607090; }

  .btn-row { display: flex; gap: 8px; justify-content: flex-end; }
  .btn {
    padding: 6px 14px;
    border: 1px solid #3a3a3a;
    background: #252527;
    color: #b0a898;
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
    font-family: 'Segoe UI', sans-serif;
  }
  .btn:hover { background: #2e2e32; color: #ddd8d0; }
  .btn.primary { border-color: #506070; color: #90b0c8; }
</style>
</head>
<body>

<div id="menu">
  <div id="title">Scene Selector Menu</div>

  <div class="category" onclick="toggleSubmenu('adjMode')">
    <span>Offset Adjust Mode</span>
    <span class="arrow" id="adjMode-arrow">▶</span>
  </div>
  <div class="submenu" id="adjMode-sub">
    <div class="submenu-item" onclick="pickOffset('None')">None</div>
    <div class="submenu-item" onclick="pickOffset('PosXY')">Position XY</div>
    <div class="submenu-item" onclick="pickOffset('PosRZ')">Position RZ</div>
    <div class="submenu-item" onclick="pickOffset('SceneXY')">Scene XY</div>
    <div class="submenu-item" onclick="pickOffset('SceneRZ')">Scene RZ</div>
  </div>

  <div class="category" onclick="toggleSubmenu('scenes')">
    <span>Change Current Scene</span>
    <span class="arrow" id="scenes-arrow">▶</span>
  </div>
  <div class="submenu" id="scenes-sub"></div>

  <div class="category" onclick="showCustomInputEntry()">
    <span>Reset Scenes by Tag / Name...</span>
  </div>

  <div id="text-entry">
    <div id="text-entry-box">
      <label>Enter tag or scene name:</label>
      <input type="text" id="tag-input" placeholder="e.g. Oral, Vaginal..." />
      <div class="btn-row">
        <div class="btn" onclick="cancelCustomInputEntry()">Cancel</div>
        <div class="btn primary" onclick="confirmCustomInputEntry()">Confirm</div>
      </div>
    </div>
  </div>
</div>

<script>
  function toggleSubmenu(id) {
      const ids = ['adjMode', 'scenes'];
      ids.forEach(function(otherId) {
          if (otherId !== id) {
              document.getElementById(otherId + '-sub').classList.remove('open');
              const otherArrow = document.getElementById(otherId + '-arrow');
              if (otherArrow) otherArrow.textContent = '▶';
          }
      });
      const sub = document.getElementById(id + '-sub');
      const arrow = document.getElementById(id + '-arrow');
      const isOpen = sub.classList.toggle('open');
      if (arrow) arrow.textContent = isOpen ? '▼' : '▶';
  }

  window.populateScenes = function(jsonStr) {
    const data = JSON.parse(jsonStr);
    const container = document.getElementById('scenes-sub');
    container.innerHTML = '';
    // Active scene first, rest sorted alphabetically
    const sorted = [data.activeScene].concat(
      data.scenes.filter(function(name) { return name !== data.activeScene; }).sort()
    );
    sorted.forEach(function(name) {
      const div = document.createElement('div');
      div.className = 'submenu-item' + (name === data.activeScene ? ' active-scene' : '');
      div.textContent = name === data.activeScene ? '▶ ' + name : name;
      div.onclick = function() { window.OnSceneSelected(name); };
      container.appendChild(div);
    });
  };

  function pickOffset(mode) {
    window.OnOffsetModeSelected(mode);
  }

  function showCustomInputEntry() {
    document.getElementById('text-entry').classList.add('open');
    setTimeout(function() { document.getElementById('tag-input').focus(); }, 50);
  }
  function cancelCustomInputEntry() {
    document.getElementById('text-entry').classList.remove('open');
    document.getElementById('tag-input').value = '';
  }
  function confirmCustomInputEntry() {
    const val = document.getElementById('tag-input').value.trim();
    document.getElementById('text-entry').classList.remove('open');
    document.getElementById('tag-input').value = '';
    if (val) window.OnSceneResetBySearch(val);
  }

  document.getElementById('tag-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') confirmCustomInputEntry();
      if (e.key === 'Escape') cancelCustomInputEntry();
      e.stopPropagation(); // prevent Esc from also triggering OnMenuClosed while typing
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') window.OnMenuClosed();
  });
</script>
</body>
</html>
