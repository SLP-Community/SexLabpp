<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="slp_stylesheet.css" />
</head>
<body>
  
<div class="sl-menu">
  <div class="sl-menu-title">Scene Selection Menu</div>

  <div class="sl-row" onclick="toggleSubmenu('adjMode')">
    <span>Offset Adjust Mode</span>
    <span class="arrow" id="adjMode-arrow">▶</span>
  </div>
  <div class="submenu" id="adjMode-sub">
    <div class="submenu-item" onclick="pickOffset('None')">None</div>
    <div class="submenu-item" onclick="pickOffset('PosXY')">Position XY</div>
    <div class="submenu-item" onclick="pickOffset('PosRZ')">Position RZ</div>
    <div class="submenu-item" onclick="pickOffset('SceneXY')">Scene XY</div>
    <div class="submenu-item" onclick="pickOffset('SceneRZ')">Scene RZ</div>
  </div>

  <div class="sl-row" onclick="toggleSubmenu('scenes')">
    <span>Change Current Scene</span>
    <span class="arrow" id="scenes-arrow">▶</span>
  </div>
  <div class="submenu" id="scenes-sub"></div>

  <div class="sl-row" onclick="showCustomInputEntry()">
    <span>Reset Scenes by Tag / Name...</span>
  </div>

  <div id="text-entry">
    <div id="text-entry-box">
      <label>Enter tag or scene name:</label>
      <input type="text" id="tag-input" placeholder="e.g. Oral, Vaginal..." />
      <div class="btn-row">
        <div class="btn" onclick="cancelCustomInputEntry()">Cancel</div>
        <div class="btn primary" onclick="confirmCustomInputEntry()">Confirm</div>
      </div>
    </div>
  </div>
</div>

<script>
  function toggleSubmenu(id) {
    ['adjMode', 'scenes'].forEach(function(other) {
      if (other !== id) {
        document.getElementById(other + '-sub').classList.remove('open');
        const arr = document.getElementById(other + '-arrow');
        if (arr) arr.textContent = '▶';
      }
    });
    const sub   = document.getElementById(id + '-sub');
    const arrow = document.getElementById(id + '-arrow');
    const isOpen = sub.classList.toggle('open');
    if (arrow) arrow.textContent = isOpen ? '▼' : '▶';
  }

  window.populateScenes = function(jsonStr) {
    const data = JSON.parse(jsonStr);
    const container = document.getElementById('scenes-sub');
    container.innerHTML = '';
    const sorted = [data.activeScene].concat(
      data.scenes.filter(function(n) { return n !== data.activeScene; }).sort()
    );
    sorted.forEach(function(name) {
      const div = document.createElement('div');
      div.className = 'submenu-item' + (name === data.activeScene ? ' active-scene' : '');
      div.textContent = name === data.activeScene ? '▶ ' + name : name;
      div.onclick = function() { window.OnSceneSelected(name); };
      container.appendChild(div);
    });
  };

  function pickOffset(mode) { window.OnOffsetModeSelected(mode); }

  function showCustomInputEntry() {
    document.getElementById('text-entry').classList.add('open');
    setTimeout(function() { document.getElementById('tag-input').focus(); }, 50);
  }
  function cancelCustomInputEntry() {
    document.getElementById('text-entry').classList.remove('open');
    document.getElementById('tag-input').value = '';
  }
  function confirmCustomInputEntry() {
    const val = document.getElementById('tag-input').value.trim();
    cancelCustomInputEntry();
    if (val) window.OnSceneResetBySearch(val);
  }

  document.getElementById('tag-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') confirmCustomInputEntry();
    if (e.key === 'Escape') cancelCustomInputEntry();
    e.stopPropagation();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (document.getElementById('text-entry').classList.contains('open')) return;
      if (typeof window.OnMenuClosed === 'function') window.OnMenuClosed();
    }
    if (e.key === 'Enter') {
      if (document.getElementById('text-entry').classList.contains('open')) return;
      const active = document.querySelector('.sl-row.active, .submenu-item.active');
      if (active && active.onclick) active.click();
    }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (document.getElementById('text-entry').classList.contains('open')) return;

      const openSub = document.querySelector('.submenu.open');
      if (openSub) {
        const items = Array.from(openSub.querySelectorAll('.submenu-item'));
        if (!items.length) return;
        const cur = openSub.querySelector('.submenu-item.active');
        const idx = cur ? items.indexOf(cur) : -1;
        const next = e.key === 'ArrowDown'
          ? items[Math.min(idx + 1, items.length - 1)]
          : items[Math.max(idx - 1, 0)];
        if (cur) cur.classList.remove('active');
        next.classList.add('active');
        next.scrollIntoView({ block: 'nearest' });
      } else {
        const rows = Array.from(document.querySelectorAll('.sl-row'));
        if (!rows.length) return;
        const cur = document.querySelector('.sl-row.active');
        const idx = cur ? rows.indexOf(cur) : -1;
        const next = e.key === 'ArrowDown'
          ? rows[Math.min(idx + 1, rows.length - 1)]
          : rows[Math.max(idx - 1, 0)];
        if (cur) cur.classList.remove('active');
        next.classList.add('active');
        next.scrollIntoView({ block: 'nearest' });
      }
    }
  });
</script>
</body>
</html>
